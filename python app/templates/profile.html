{% extends "base.html" %}

{% block title %}Профиль пользователя{% endblock %}

{% block content %}
<div class="profile-main__container">
    <h2>Профиль {{ current_user.username }}</h2>

    <!-- Контейнер для аватара -->
    <div class="avatar-container">
        <img id="avatar-img" src="{{ url_for('static', filename=current_user.avatar_url) }}" alt="Аватар" width="150" height="150">
        <!-- Кнопка для загрузки, скрыта по умолчанию -->
        <label for="avatar-upload" class="upload-button">Загрузить</label>
        <input type="file" id="avatar-upload" style="display: none;" onchange="uploadAvatar(this)">
    </div>

    <p>Никнейм: {{ current_user.username }}</p>
    <p>Email: {{ current_user.email }}</p>
    <button onclick="window.location.href='{{ url_for('logout') }}'">Выйти из аккаунта</button>
</div>

<style>
    .avatar-container {
        position: relative;
        display: inline-block;
    }

    #avatar-img {
        border-radius: 50%; /* Делает изображение круглым */
        transition: transform 0.3s ease;
    }

    .avatar-container:hover #avatar-img {
        transform: scale(1.1); /* Увеличение аватара при наведении */
    }

    .upload-button {
        position: absolute;
        bottom: -6px;
        right: -6px;
        left:-6px;
        top: -6px;
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        border-radius: 50%; 
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease-in-out 1.3s;
    }

    .upload-button {
        display: none;
    }

    .avatar-container:hover .upload-button {
        opacity: 1; /* Кнопка появляется */
        pointer-events: auto;
        display: block;
    }
</style>
<script>
    function showUploadButton() {
    // Отображаем кнопку при наведении
    document.querySelector('.upload-button').style.display = 'block';
}

function hideUploadButton() {
    // Скрываем кнопку, если аватар вернулся в исходное состояние
    document.querySelector('.upload-button').style.display = 'none';
}

function uploadAvatar(input) {
    let formData = new FormData();
    formData.append("avatar", input.files[0]); // Добавляем файл в форму

    fetch("/upload-avatar", {
        method: "POST",
        body: formData,
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Если загрузка прошла успешно, обновляем аватар на странице
            document.getElementById("avatar-img").src = data.avatar_url;
        } else {
            alert("Ошибка при загрузке аватара");
        }
    })
    .catch(error => {
        console.error("Ошибка:", error);
    });
}
</script>
{% endblock %}
